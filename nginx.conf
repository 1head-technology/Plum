server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # This line is the magic key for Vue Router:
        # It tells Nginx: "If you can't find the exact file requested,
        # fall back to index.html and let Vue handle the routing."
        try_files $uri $uri/ /index.html;
    }

    # Error pages configuration
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
